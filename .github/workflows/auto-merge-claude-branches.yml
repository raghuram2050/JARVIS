name: Auto-merge Claude app branches

on:
  push:
    branches:
      - 'claude/**'

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge branch to main
        run: |
          git fetch origin
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          echo "Merging $BRANCH_NAME into main..."

          git checkout main
          git merge origin/$BRANCH_NAME -m "Auto-merge: $BRANCH_NAME into main

Co-Authored-By: Claude Haiku 4.5 <noreply@anthropic.com>"

          git push origin main
        continue-on-error: true

      - name: Comment on conflict (if any)
        if: failure()
        run: |
          echo "⚠️ Auto-merge failed - manual intervention needed"
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          echo "Branch: $BRANCH_NAME could not be automatically merged to main"
          echo "Check for conflicts and merge manually."
